name: Publish Native Release

on:
  pull_request:
    paths:
      - ".github/workflows/publish_native.yml"
      - "scripts/build-native-release.sh"
      - "scripts/check_release_workflows.py"
      - "scripts/explorer-service-launcher"
      - "scripts/native_release.py"
      - "scripts/test_native_release.py"
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Validate source tag
        id: release
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tag="pr-${{ github.event.pull_request.number }}"
            version="0.0.0-pr.${{ github.event.pull_request.number }}"
            prerelease=true
          else
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "Native releases must run from an existing v* tag." >&2
              exit 1
            fi
            tag=${GITHUB_REF#refs/tags/}
            version=${tag#v}
            prerelease=false
            if [[ $version == *-* ]]; then
              prerelease=true
            fi
          fi

          python3 scripts/native_release.py validate \
            --version "$version" \
            --commit "$commit"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            python3 scripts/native_release.py validate-source \
              --root . \
              --version "$version"
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$commit"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $TAG." >&2
            exit 1
          fi

      - name: Validate release contracts
        run: |
          set -euo pipefail
          python3 scripts/test_native_release.py
          python3 scripts/check_release_workflows.py

  ci-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  build-linux:
    needs:
      - validate
      - ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and smoke-test Linux bundle
        uses: ./.github/actions/run-in-ci-image
        with:
          image: ${{ needs.ci-image.outputs.image }}
          run: |
            rustup target add wasm32-unknown-unknown
            cargo binstall --no-confirm cargo-leptos@0.3.7
            bash scripts/build-native-release.sh \
              "${{ needs.validate.outputs.version }}" \
              linux-amd64 \
              "${{ needs.validate.outputs.commit }}" \
              release-artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-linux-amd64
          path: release-artifact/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          brew install pkg-config
          rustup target add wasm32-unknown-unknown

      - name: Install cargo-leptos
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-leptos@0.3.7
          fallback: none

      - name: Install macOS Metal Toolchain
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -downloadComponent metalToolchain
          env -u DEVELOPER_DIR -u SDKROOT xcrun --sdk macosx --find metal
          env -u DEVELOPER_DIR -u SDKROOT xcrun --sdk macosx --find metallib

      - name: Install matching r0vm
        run: |
          set -euo pipefail
          curl -L --proto '=https' --tlsv1.2 -sSf https://risczero.com/install | bash
          "$HOME/.risc0/bin/rzup" install r0vm 3.0.5
          "$HOME/.risc0/bin/r0vm" --version
          printf '%s\n' "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - name: Build and smoke-test macOS bundle
        run: |
          set -euo pipefail
          bash scripts/build-native-release.sh \
            "${{ needs.validate.outputs.version }}" \
            darwin-arm64 \
            "${{ needs.validate.outputs.commit }}" \
            release-artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-darwin-arm64
          path: release-artifact/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs:
      - validate
      - build-linux
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: release-artifact
          merge-multiple: true

      - name: Verify complete artifact set
        run: |
          set -euo pipefail
          python3 scripts/native_release.py write-checksums \
            --input-dir release-artifact \
            --version "${{ needs.validate.outputs.version }}" \
            --commit "${{ needs.validate.outputs.commit }}"
          python3 scripts/native_release.py verify-release \
            --input-dir release-artifact \
            --version "${{ needs.validate.outputs.version }}" \
            --commit "${{ needs.validate.outputs.commit }}"

      - name: Write release notes
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          # Logos Execution Zone v$VERSION

          Source commit: \`$COMMIT\`

          Native operator bundles:

          - Linux x86_64
          - Apple silicon macOS (unsigned)

          Both bundles contain wallet, sequencer, standalone sequencer, indexer,
          explorer, matching r0vm, FFI libraries, configuration examples,
          per-file manifests, and runtime dependency reports.

          Verify downloads with \`SHA256SUMS\`. See
          \`docs/native-releases.md\` at this tag for installation and security
          notes. Matching service containers are published to this repository's
          GHCR namespace.
          EOF

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          name: Logos Execution Zone v${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: false
          files: |
            release-artifact/*.tar.gz
            release-artifact/SHA256SUMS

      - name: Verify uploaded draft and publish
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir published-artifact
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-artifact
          python3 scripts/native_release.py verify-release \
            --input-dir published-artifact \
            --version "$VERSION" \
            --commit "$COMMIT"
          if [[ $PRERELEASE == true ]]; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease \
              --latest=false
          else
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest
          fi

      - name: Remove failed draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish \
            --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null || true)
          if [[ $state == "$(printf 'true\t%s' "$GITHUB_SHA")" ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
